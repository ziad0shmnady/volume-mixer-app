[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mixer"
version = "1.0.0"
description = "GTK4/libadwaita per-application volume mixer for Ubuntu (PipeWire/PulseAudio)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ziad" }]
dependencies = [
    "pulsectl>=24.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
mixer = "mixer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mixer = ["py.typed", "data/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
